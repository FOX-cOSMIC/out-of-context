# Generate the Xcode project with:  cd ios && xcodegen generate
name: CareCompanion
options:
  bundleIdPrefix: com.outofcontext
  deploymentTarget:
    iOS: "17.0"
targets:
  CareCompanion:
    type: application
    platform: iOS
    sources:
      - CareCompanion
      # Sample photos for the -demoScan launch argument (DemoLaunch.swift).
      - path: ../public/samples/medication-plan.png
        buildPhase: resources
      - path: ../public/samples/test/medicine-box-new-amlodipine.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.outofcontext.carecompanion
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: CareCompanion/Info.plist
      properties:
        CFBundleDisplayName: Agatha
        UILaunchScreen: {}
        UIAppFonts: [Quicksand.ttf, AtkinsonHyperlegible-Regular.ttf, AtkinsonHyperlegible-Bold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Agatha listens when you tap Talk, so you can speak instead of typing.
        NSSpeechRecognitionUsageDescription: Agatha writes down what you say while you speak.
        NSCameraUsageDescription: Agatha reads photos of your medication plan and letters.
        NSPhotoLibraryUsageDescription: Agatha reads photos of your medication plan and letters.
        NSLocalNetworkUsageDescription: Agatha talks to the helper computer.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
