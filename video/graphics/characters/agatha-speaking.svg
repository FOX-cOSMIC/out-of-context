      <rect x="38" y="28" width="124" height="104" rx="50" fill="#FFFFFF" stroke="#DDD0F5" stroke-width="2"/>
      <rect id="agatha-visor" x="52" y="46" width="96" height="70" rx="32" fill="#2A2140"/>
