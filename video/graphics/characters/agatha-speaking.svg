<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -10 280 222" role="img" aria-label="Agatha speaking">
<title>Agatha speaking</title>

  <ellipse id="agatha-shadow" cx="100" cy="200" rx="46" ry="6" fill="#EFE6FF"/>
  
  <g id="agatha" >
    <g id="agatha-arm-left" transform="rotate(55 56 140)" data-pivot="56 140">
