    </g>
    <g id="agatha-arm-right" transform="rotate(0 144 138)" data-pivot="144 138">
      <ellipse cx="158" cy="146" rx="11" ry="18" fill="#FFFFFF" stroke="#DDD0F5" stroke-width="2" transform="rotate(-28 158 146)"/>
    </g>
    <g id="agatha-body">
