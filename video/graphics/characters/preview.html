<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agatha Characters</title>
<style>
  :root { --bg: #FAF9F5; --ink: #1E1B2E; --muted: #6B6680; --card: #FFFFFF; --line: #E6E1F0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: var(--bg); color: var(--ink);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; }
  .pane { height: 330px; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .pane.light { background: #FAF9F5; }
  .pane.dark { background: #1E1B2E; }
  .pane img { max-width: 100%; max-height: 100%; }
  .name { padding: 10px 14px; font: 600 14px ui-monospace, Menlo, monospace; border-top: 1px solid var(--line); }
  @media (max-width: 800px) { body { padding: 16px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Agatha demo video: characters</h1>
<p class="sub">Each SVG on a light and a dark background. Source: build.py in this folder.</p>
<div class="grid" id="grid"></div>
<script>
  const files = [
    "margaret-portrait.svg", "margaret-table.svg", "margaret-phone-call.svg", "margaret-thinking.svg",
    "anna-phone.svg", "agatha-speaking.svg", "agatha-listening.svg", "agatha-happy.svg",
  ];
  const grid = document.getElementById("grid");
  for (const f of files) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="pair"><div class="pane light"><img src="${f}" alt="${f}"></div>` +
      `<div class="pane dark"><img src="${f}" alt="${f}"></div></div><div class="name">${f}</div>`;
    grid.appendChild(card);
  }
</script>
</body>
</html>
