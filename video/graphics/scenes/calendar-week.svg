<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" width="1400" height="360">
  <!-- Agatha demo: one week of doses. day-1..day-7, each with a status circle (tick-N: green tick =
       taken, orange clock = late/missed) and doses-N (morning / noon / evening dots).
       Days 3 and 6 are orange. Day 7 = today (purple ring). Pop days in one by one. -->
  <rect x="24" y="44" width="1352" height="292" rx="56" fill="#1E1B2E" opacity="0.08"/>
  <rect id="week-card" x="20" y="30" width="1360" height="290" rx="56" fill="#FAF9F5"/>
    <g id="day-1" data-status="ok">
      <rect x="94" y="80" width="72" height="16" rx="8" fill="#D9D3E6"/>
      <circle cx="130" cy="186" r="52" fill="#17694B"/>
      <g id="tick-1"><path d="M110,186 L124,200 L152,172" stroke="#FAF9F5" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="doses-1"><circle cx="104" cy="282" r="8" fill="#17694B"/><circle cx="130" cy="282" r="8" fill="#17694B"/><circle cx="156" cy="282" r="8" fill="#17694B"/></g>
    </g>
    <g id="day-2" data-status="ok">
      <rect x="284" y="80" width="72" height="16" rx="8" fill="#D9D3E6"/>
      <circle cx="320" cy="186" r="52" fill="#17694B"/>
      <g id="tick-2"><path d="M300,186 L314,200 L342,172" stroke="#FAF9F5" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="doses-2"><circle cx="294" cy="282" r="8" fill="#17694B"/><circle cx="320" cy="282" r="8" fill="#17694B"/><circle cx="346" cy="282" r="8" fill="#17694B"/></g>
    </g>
    <g id="day-3" data-status="late">
      <rect x="474" y="80" width="72" height="16" rx="8" fill="#D9D3E6"/>
      <circle cx="510" cy="186" r="52" fill="#FF7A3D"/>
      <g id="tick-3"><circle cx="510" cy="186" r="22" fill="none" stroke="#FAF9F5" stroke-width="7"/><path d="M510,174 V187 L519,193" stroke="#FAF9F5" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="doses-3"><circle cx="484" cy="282" r="8" fill="#17694B"/><circle cx="510" cy="282" r="8" fill="#FF7A3D"/><circle cx="536" cy="282" r="8" fill="#17694B"/></g>
    </g>
    <g id="day-4" data-status="ok">
      <rect x="664" y="80" width="72" height="16" rx="8" fill="#D9D3E6"/>
      <circle cx="700" cy="186" r="52" fill="#17694B"/>
      <g id="tick-4"><path d="M680,186 L694,200 L722,172" stroke="#FAF9F5" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="doses-4"><circle cx="674" cy="282" r="8" fill="#17694B"/><circle cx="700" cy="282" r="8" fill="#17694B"/><circle cx="726" cy="282" r="8" fill="#17694B"/></g>
    </g>
    <g id="day-5" data-status="ok">
      <rect x="854" y="80" width="72" height="16" rx="8" fill="#D9D3E6"/>
      <circle cx="890" cy="186" r="52" fill="#17694B"/>
      <g id="tick-5"><path d="M870,186 L884,200 L912,172" stroke="#FAF9F5" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="doses-5"><circle cx="864" cy="282" r="8" fill="#17694B"/><circle cx="890" cy="282" r="8" fill="#17694B"/><circle cx="916" cy="282" r="8" fill="#17694B"/></g>
    </g>
    <g id="day-6" data-status="late">
      <rect x="1044" y="80" width="72" height="16" rx="8" fill="#D9D3E6"/>
      <circle cx="1080" cy="186" r="52" fill="#FF7A3D"/>
      <g id="tick-6"><circle cx="1080" cy="186" r="22" fill="none" stroke="#FAF9F5" stroke-width="7"/><path d="M1080,174 V187 L1089,193" stroke="#FAF9F5" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="doses-6"><circle cx="1054" cy="282" r="8" fill="#17694B"/><circle cx="1080" cy="282" r="8" fill="#17694B"/><circle cx="1106" cy="282" r="8" fill="#FF7A3D"/></g>
    </g>
    <g id="day-7" data-status="ok">
      <rect x="1234" y="80" width="72" height="16" rx="8" fill="#6B3FE0"/>
      <circle cx="1270" cy="186" r="62" fill="none" stroke="#6B3FE0" stroke-width="6"/>
      <circle cx="1270" cy="186" r="52" fill="#17694B"/>
      <g id="tick-7"><path d="M1250,186 L1264,200 L1292,172" stroke="#FAF9F5" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="doses-7"><circle cx="1244" cy="282" r="8" fill="#17694B"/><circle cx="1270" cy="282" r="8" fill="#17694B"/><circle cx="1296" cy="282" r="8" fill="#17694B"/></g>
    </g>
</svg>
