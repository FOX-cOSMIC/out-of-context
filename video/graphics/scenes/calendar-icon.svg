<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Agatha demo: calendar with the heart-ultrasound appointment highlighted.
       appointment-day = the orange day (pulse/scale it); appointment-badge = floating heart tag.
       Mint days with dots = days already passed. No numbers by design (text is added in Remotion). -->
