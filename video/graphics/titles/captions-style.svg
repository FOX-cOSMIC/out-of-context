<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Caption style</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap');
.h{font-family:Quicksand,'Varela Round',Nunito,'Arial Rounded MT Bold',system-ui,sans-serif;font-weight:700}
.b{font-family:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;font-weight:400}
.bb{font-family:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;font-weight:700}
</style>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E1B2E" flood-opacity="0.18"/></filter></defs>

<g id="spec-notes" opacity="0.9"><rect x="64" y="60" width="760" height="186" rx="24" fill="#FAF9F5"/><text x="96" y="112" class="h" font-size="32" fill="#3E1F99">Caption style</text><text x="96" y="156" class="b" font-size="24" fill="#1E1B2E">Atkinson Hyperlegible 700 · 46 px · white</text><text x="96" y="190" class="b" font-size="24" fill="#1E1B2E">Pill: ink #1E1B2E at 72 % · radius 30 · max 2 lines</text><text x="96" y="224" class="b" font-size="24" fill="#1E1B2E">Bottom edge 90 px above frame · hide this group</text></g><g id="caption-margaret"><rect id="caption-margaret-pill" x="725.9" y="690" width="468.2" height="132" rx="30" fill="#1E1B2E" fill-opacity="0.72"/><g id="caption-margaret-speaker"><text x="960" y="730" class="bb" font-size="22" fill="#FF7A3D" text-anchor="middle" letter-spacing="2.5">MARGARET</text></g><g id="caption-margaret-line1"><text x="960.0" y="784.0" class="bb" font-size="46.0" fill="#FFFFFF" text-anchor="middle"><tspan id="caption-margaret-line1-w1" class="word">Yes,</tspan> <tspan id="caption-margaret-line1-w2" class="word">I</tspan> <tspan id="caption-margaret-line1-w3" class="word">took</tspan> <tspan id="caption-margaret-line1-w4" class="word">them.</tspan></text></g></g>
<g id="caption-agatha"><rect id="caption-agatha-pill" x="294.9" y="862" width="1330.1" height="194" rx="30" fill="#1E1B2E" fill-opacity="0.72"/><g id="caption-agatha-speaker"><text x="960" y="902" class="bb" font-size="22" fill="#CDB8FF" text-anchor="middle" letter-spacing="2.5">AGATHA</text></g><g id="caption-agatha-line1"><text x="960.0" y="956.0" class="bb" font-size="46.0" fill="#FFFFFF" text-anchor="middle"><tspan id="caption-agatha-line1-w1" class="word">Good</tspan> <tspan id="caption-agatha-line1-w2" class="word">morning,</tspan> <tspan id="caption-agatha-line1-w3" class="word">Margaret.</tspan> <tspan id="caption-agatha-line1-w4" class="word">It’s</tspan> <tspan id="caption-agatha-line1-w5" class="word">time</tspan> <tspan id="caption-agatha-line1-w6" class="word">for</tspan> <tspan id="caption-agatha-line1-w7" class="word">your</tspan> <tspan id="caption-agatha-line1-w8" class="word">morning</tspan> <tspan id="caption-agatha-line1-w9" class="word">pills:</tspan></text></g><g id="caption-agatha-line2"><text x="960.0" y="1018.0" class="bb" font-size="46.0" fill="#FFFFFF" text-anchor="middle"><tspan id="caption-agatha-line2-w1" class="word">Ramipril,</tspan> <tspan id="caption-agatha-line2-w2" class="word">Metformin,</tspan> <tspan id="caption-agatha-line2-w3" class="word">Pantoprazole</tspan> <tspan id="caption-agatha-line2-w4" class="word">and</tspan> <tspan id="caption-agatha-line2-w5" class="word">your</tspan> <tspan id="caption-agatha-line2-w6" class="word">aspirin.</tspan></text></g></g>
</svg>
