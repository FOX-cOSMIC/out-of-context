<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agatha Title Graphics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root { --ink:#1E1B2E; --muted:#5D5873; --paper:#FAF9F5; --line:#E4DFEE; --purple:#6B3FE0; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
  header { padding:28px 32px 8px; }
  h1 { font:700 32px/1.2 Quicksand, sans-serif; margin:0 0 4px; color:#3E1F99; }
  header p { margin:0; color:var(--muted); }
  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 640px), 1fr)); gap:28px; padding:24px 32px 40px; }
  figure { margin:0; }
  .frame { aspect-ratio:16/9; border:1px solid var(--line); border-radius:12px; overflow:hidden;
    /* checkerboard shows which graphics are transparent */
    background:#fff conic-gradient(#ECEAF2 25%, #fff 0 50%, #ECEAF2 0 75%, #fff 0) 0 0/28px 28px; }
  .frame.dark { background:#3a3f45 conic-gradient(#2f3439 25%, #3a3f45 0 50%, #2f3439 0 75%, #3a3f45 0) 0 0/28px 28px; }
  object { display:block; width:100%; height:100%; }
  figcaption { margin-top:8px; font-weight:700; }
  figcaption span { font-weight:400; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Agatha · video title graphics</h1>
  <p>1920 × 1080 SVGs, shown scaled. Checkerboard = transparent background. Dark checkerboard stands in for video footage.</p>
</header>
<main>
  <figure><div class="frame"><object type="image/svg+xml" data="title-open.svg"></object></div>
    <figcaption>title-open.svg <span>· lavender background · 0:00</span></figcaption></figure>
  <figure><div class="frame dark"><object type="image/svg+xml" data="hook-cards.svg"></object></div>
    <figcaption>hook-cards.svg <span>· transparent · over the kitchen shot</span></figcaption></figure>
  <figure><div class="frame dark"><object type="image/svg+xml" data="lower-thirds.svg"></object></div>
    <figcaption>lower-thirds.svg <span>· transparent · one group per beat, move to y≈880</span></figcaption></figure>
  <figure><div class="frame dark"><object type="image/svg+xml" data="skills-row.svg"></object></div>
    <figcaption>skills-row.svg <span>· transparent · 1:43 close</span></figcaption></figure>
  <figure><div class="frame"><object type="image/svg+xml" data="tech-card.svg"></object></div>
    <figcaption>tech-card.svg <span>· off-white background</span></figcaption></figure>
  <figure><div class="frame"><object type="image/svg+xml" data="end-card.svg"></object></div>
    <figcaption>end-card.svg <span>· off-white background · 1:50</span></figcaption></figure>
  <figure><div class="frame dark"><object type="image/svg+xml" data="captions-style.svg"></object></div>
    <figcaption>captions-style.svg <span>· transparent · subtitle style sample</span></figcaption></figure>
</main>
</body>
</html>
