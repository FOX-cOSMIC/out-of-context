</style>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E1B2E" flood-opacity="0.18"/></filter></defs>
<rect id="background" width="1920" height="1080" fill="#EFE6FF"/>
<g id="decor"><circle cx="1730" cy="150" r="260" fill="#6B3FE0" opacity="0.07"/><circle cx="170" cy="960" r="230" fill="#6B3FE0" opacity="0.06"/><circle cx="1585" cy="300" r="22" fill="#FF7A3D"/><circle cx="330" cy="790" r="14" fill="#6B3FE0" opacity="0.5"/></g><g id="eyebrow"><rect x="743.7" y="250" width="432.6" height="58" rx="29" fill="#FFFFFF"/><text x="960" y="289.5" class="bb" font-size="30" fill="#6B3FE0" text-anchor="middle" letter-spacing="0.5"><tspan id="eyebrow-w1" class="word">AI</tspan> <tspan id="eyebrow-w2" class="word">education</tspan> <tspan id="eyebrow-w3" class="word">for</tspan> <tspan id="eyebrow-w4" class="word">everyone</tspan></text></g><g id="title"><text x="960" y="560" class="h" font-size="250" fill="#3E1F99" text-anchor="middle" letter-spacing="-4">Agatha</text></g><g id="subtitle"><g id="subtitle-line1"><text x="960.0" y="690.0" class="b" font-size="58.0" fill="#1E1B2E" text-anchor="middle"><tspan id="subtitle-line1-w1" class="word">A</tspan> <tspan id="subtitle-line1-w2" class="word">voice</tspan> <tspan id="subtitle-line1-w3" class="word">companion</tspan> <tspan id="subtitle-line1-w4" class="word">that</tspan> <tspan id="subtitle-line1-w5" class="word">helps</tspan> <tspan id="subtitle-line1-w6" class="word">older</tspan> <tspan id="subtitle-line1-w7" class="word">adults</tspan></text></g><g id="subtitle-line2"><text x="960.0" y="766.6" class="b" font-size="58.0" fill="#1E1B2E" text-anchor="middle"><tspan id="subtitle-line2-w1" class="word">with</tspan> <tspan id="subtitle-line2-w2" class="word">their</tspan> <tspan id="subtitle-line2-w3" class="word">medicines</tspan> <tspan id="subtitle-line2-w4" class="word">—</tspan> <tspan id="subtitle-line2-w5" class="word" fill="#6B3FE0" font-weight="700">and</tspan> <tspan id="subtitle-line2-w6" class="word" fill="#6B3FE0" font-weight="700">with</tspan> <tspan id="subtitle-line2-w7" class="word" fill="#6B3FE0" font-weight="700">AI.</tspan></text></g></g>
