<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Hook stat cards</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap');
.h{font-family:Quicksand,'Varela Round',Nunito,'Arial Rounded MT Bold',system-ui,sans-serif;font-weight:700}
.b{font-family:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;font-weight:400}
.bb{font-family:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;font-weight:700}
</style>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E1B2E" flood-opacity="0.18"/></filter></defs>

<g id="card-margaret" filter="url(#shadow)"><rect x="100.0" y="760" width="540" height="250" rx="40" fill="#FAF9F5"/><rect x="100.0" y="800" width="10" height="170" rx="5" fill="#6B3FE0"/><g id="card-margaret-icon" transform="translate(184.0 838.0)"><circle r="38" fill="#6B3FE0"/><g transform="scale(0.95)"><g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-9" r="9"/><path d="M-17 20 a17 15 0 0 1 34 0"/></g></g></g><g id="card-margaret-label"><text x="240.0" y="848.0" class="bb" font-size="26.0" fill="#5D5873" text-anchor="start"><tspan id="card-margaret-label-w1" class="word">MEET</tspan></text></g><g id="card-margaret-value"><text x="144.0" y="950.0" class="h" font-size="62.0" fill="#1E1B2E" text-anchor="start"><tspan id="card-margaret-value-w1" class="word">Margaret,</tspan> <tspan id="card-margaret-value-w2" class="word">78</tspan></text></g></g>
<g id="card-medicines" filter="url(#shadow)"><rect x="690.0" y="760" width="540" height="250" rx="40" fill="#FAF9F5"/><rect x="690.0" y="800" width="10" height="170" rx="5" fill="#6B3FE0"/><g id="card-medicines-icon" transform="translate(774.0 838.0)"><circle r="38" fill="#6B3FE0"/><g transform="scale(0.95)"><g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-40)"><rect x="-22" y="-10" width="44" height="20" rx="10"/><path d="M0 -10 V10"/></g></g></g><g id="card-medicines-label"><text x="830.0" y="848.0" class="bb" font-size="26.0" fill="#5D5873" text-anchor="start"><tspan id="card-medicines-label-w1" class="word">EVERY</tspan> <tspan id="card-medicines-label-w2" class="word">DAY</tspan></text></g><g id="card-medicines-value"><text x="734.0" y="950.0" class="h" font-size="52.0" fill="#1E1B2E" text-anchor="start"><tspan id="card-medicines-value-w1" class="word">5</tspan> <tspan id="card-medicines-value-w2" class="word">medicines</tspan> <tspan id="card-medicines-value-w3" class="word">a</tspan> <tspan id="card-medicines-value-w4" class="word">day</tspan></text></g></g>
<g id="card-never-ai" filter="url(#shadow)"><rect x="1280.0" y="760" width="540" height="250" rx="40" fill="#FAF9F5"/><rect x="1280.0" y="800" width="10" height="170" rx="5" fill="#FF7A3D"/><g id="card-never-ai-icon" transform="translate(1364.0 838.0)"><circle r="38" fill="#FF7A3D"/><g transform="scale(0.95)"><path d="M0 -22 C2 -6 6 -2 22 0 C6 2 2 6 0 22 C-2 6 -6 2 -22 0 C-6 -2 -2 -6 0 -22Z" fill="#FFFFFF"/></g></g><g id="card-never-ai-label"><text x="1420.0" y="848.0" class="bb" font-size="26.0" fill="#5D5873" text-anchor="start"><tspan id="card-never-ai-label-w1" class="word">UNTIL</tspan> <tspan id="card-never-ai-label-w2" class="word">TODAY</tspan></text></g><g id="card-never-ai-value"><text x="1324.0" y="950.0" class="h" font-size="62.0" fill="#1E1B2E" text-anchor="start"><tspan id="card-never-ai-value-w1" class="word">Never</tspan> <tspan id="card-never-ai-value-w2" class="word">used</tspan> <tspan id="card-never-ai-value-w3" class="word">AI</tspan></text></g></g>
</svg>
