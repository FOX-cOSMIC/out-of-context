<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Three AI skills</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap');
.h{font-family:Quicksand,'Varela Round',Nunito,'Arial Rounded MT Bold',system-ui,sans-serif;font-weight:700}
.b{font-family:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;font-weight:400}
.bb{font-family:'Atkinson Hyperlegible',Verdana,'Segoe UI',system-ui,sans-serif;font-weight:700}
</style>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E1B2E" flood-opacity="0.18"/></filter></defs>

<g id="skills-heading-plate"><rect x="438.3" y="212" width="1043.3" height="120" rx="60" fill="#FAF9F5" filter="url(#shadow)"/></g>
<g id="skills-heading"><text x="960.0" y="300.0" class="h" font-size="76.0" fill="#3E1F99" text-anchor="middle"><tspan id="skills-heading-w1" class="word" fill="#FF7A3D">3</tspan> <tspan id="skills-heading-w2" class="word" fill="#FF7A3D">AI</tspan> <tspan id="skills-heading-w3" class="word" fill="#FF7A3D">skills</tspan> <tspan id="skills-heading-w4" class="word">Margaret</tspan> <tspan id="skills-heading-w5" class="word">learns</tspan></text></g>
<g id="skill-talk" filter="url(#shadow)"><rect x="100.0" y="400" width="540" height="470" rx="44" fill="#FAF9F5"/><g id="skill-talk-number"><circle cx="160.0" cy="460" r="26" fill="#EFE6FF"/><text x="160.0" y="470" class="h" font-size="28" fill="#6B3FE0" text-anchor="middle">1</text></g><g id="skill-talk-icon" transform="translate(370.0 590.0)"><circle r="100" fill="#6B3FE0"/><g transform="scale(2.0)"><g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-8" y="-21" width="16" height="27" rx="8"/><path d="M-15 -1 a15 15 0 0 0 30 0"/><path d="M0 14 V21 M-8 21 H8"/></g></g></g><g id="skill-talk-label"><text x="370.0" y="780.0" class="h" font-size="42.4" fill="#1E1B2E" text-anchor="middle"><tspan id="skill-talk-label-w1" class="word">Talk</tspan> <tspan id="skill-talk-label-w2" class="word">in</tspan> <tspan id="skill-talk-label-w3" class="word">your</tspan> <tspan id="skill-talk-label-w4" class="word">own</tspan> <tspan id="skill-talk-label-w5" class="word">words</tspan></text></g></g>
<g id="skill-photo" filter="url(#shadow)"><rect x="690.0" y="400" width="540" height="470" rx="44" fill="#FAF9F5"/><g id="skill-photo-number"><circle cx="750.0" cy="460" r="26" fill="#EFE6FF"/><text x="750.0" y="470" class="h" font-size="28" fill="#6B3FE0" text-anchor="middle">2</text></g><g id="skill-photo-icon" transform="translate(960.0 590.0)"><circle r="100" fill="#6B3FE0"/><g transform="scale(2.0)"><g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 -10 h9 l4 -7 h18 l4 7 h9 v28 h-44 Z"/><circle cx="0" cy="3" r="8.5"/></g></g></g><g id="skill-photo-label"><text x="960.0" y="780.0" class="h" font-size="44.0" fill="#1E1B2E" text-anchor="middle"><tspan id="skill-photo-label-w1" class="word">Show</tspan> <tspan id="skill-photo-label-w2" class="word">a</tspan> <tspan id="skill-photo-label-w3" class="word">photo</tspan></text></g></g>
<g id="skill-check" filter="url(#shadow)"><rect x="1280.0" y="400" width="540" height="470" rx="44" fill="#FAF9F5"/><g id="skill-check-number"><circle cx="1340.0" cy="460" r="26" fill="#EFE6FF"/><text x="1340.0" y="470" class="h" font-size="28" fill="#6B3FE0" text-anchor="middle">3</text></g><g id="skill-check-icon" transform="translate(1550.0 590.0)"><circle r="100" fill="#6B3FE0"/><g transform="scale(2.0)"><g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-17 1 L-5 13 L18 -12" stroke-width="5.8500000000000005"/></g></g></g><g id="skill-check-label"><text x="1550.0" y="780.0" class="h" font-size="44.0" fill="#1E1B2E" text-anchor="middle"><tspan id="skill-check-label-w1" class="word">Check</tspan> <tspan id="skill-check-label-w2" class="word">the</tspan> <tspan id="skill-check-label-w3" class="word">answer</tspan></text></g></g>
</svg>
